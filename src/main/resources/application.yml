# SPEC-PLAT-06 R76/R77 (ADR-017): every environment-specific value comes ONLY from the environment. Hosts, URLs, users,
# passwords and secrets are placeholders without a default; the service refuses to start, naming every missing variable
# (gc.required-properties). Behaviour tunables keep safe production defaults. Variables: .env.example.
gc.required-properties: >-
  spring.datasource.url, spring.datasource.username, spring.datasource.password,
  spring.flyway.placeholders.cdc_role,
  spring.security.oauth2.resourceserver.jwt.issuer-uri, spring.security.oauth2.resourceserver.jwt.jwk-set-uri,
  gc.security.internal-clients

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: identity-access-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
  # Migrations run as the schema OWNER; the service itself connects as the DML-only app role.
  # Production: GC_MIGRATE=false on the service, migrations from a pre-deploy Job (owner credentials only there).
  flyway:
    enabled: ${GC_MIGRATE:false}
    user: ${DB_OWNER_USER:}
    password: ${DB_OWNER_PASSWORD:}
    schemas: iam
    default-schema: iam
    create-schemas: true
    locations: ${GC_FLYWAY_LOCATIONS:classpath:db/migration}       # local: + classpath:db/dev-seed
    out-of-order: ${GC_FLYWAY_OUT_OF_ORDER:false}                  # SPEC-PLAT-04 R63: only with the dev seed
    clean-disabled: true
    placeholders:
      app_role: ${spring.datasource.username}
      cdc_role: ${GC_CDC_ROLE}

# SPEC-PLAT-01 D1: API docs off unless GC_API_DOCS_ENABLED=true (local).
springdoc:
  api-docs:
    enabled: ${GC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${GC_API_DOCS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# ---------------------------------------------------------------- security (skill: java-security-rbac)
# Keycloak proves identity; roles/scopes come from IAM grants. Tokens carry iss = OIDC_ISSUER_URI (validated);
# signing keys are fetched from OIDC_JWKS_URI (inside a cluster/network the issuer host may not be reachable).
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${OIDC_ISSUER_URI}
  jwk-set-uri: ${OIDC_JWKS_URI}
  audiences: gc-api,gc-internal

gc.security:
  internal-clients: ${GC_INTERNAL_CLIENTS}
  cors-allowed-origins: ${GC_CORS_ALLOWED_ORIGINS:}
